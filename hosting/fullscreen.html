<button id="fullscreen" type="button" style="position:fixed;right:12px;bottom:12px;z-index:3;border:1px solid #876879;border-radius:8px;padding:9px 13px;background:#211627;color:#f5e6cf;font:13px system-ui;cursor:pointer" aria-label="Toggle fullscreen">Full screen</button>
<script>const fsButton=document.getElementById("fullscreen");fsButton.hidden=!document.fullscreenEnabled;fsButton.addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}document.getElementById("canvas").focus();});document.addEventListener("fullscreenchange",()=>fsButton.textContent=document.fullscreenElement?"Exit full screen":"Full screen");</script>
